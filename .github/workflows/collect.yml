name: 당첨번호 모으기

# 매주 토요일 밤 추첨이 끝난 뒤(일요일 아침 9시, 한국 시간)에 새 회차를 받아 lotto_data.json에 넣는다.
# Actions 탭에서 "Run workflow"를 눌러 바로 돌릴 수도 있다.
on:
  schedule:
    - cron: "7 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 새 회차 받기
        run: python lotto.py 수집
      - name: 받은 게 있는지 확인
        run: python -c "import json,sys; d=json.load(open('lotto_data.json',encoding='utf-8')); print(len(d),'회'); sys.exit(0 if d else 1)"
      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_data.json
          git diff --cached --quiet && echo "새 회차 없음" && exit 0
          git commit -m "당첨번호 업데이트 ($(python -c "import json; print(json.load(open('lotto_data.json',encoding='utf-8'))[-1]['회차'])")회까지)"
          git push
